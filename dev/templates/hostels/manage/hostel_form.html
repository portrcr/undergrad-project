{% extends 'base.html' %}

{% block title %}{{ title }} | Hostel Booking{% endblock %}

{% block breadcrumbs %}
    <nav aria-label="Breadcrumb">
        <ol class="breadcrumb">
            <li><a href="{% url 'home' %}">Home</a></li>
            <li><a href="{% url 'hostels:manage_hostels' %}">Manage Hostels</a></li>
            <li><span aria-current="page">{{ title }}</span></li>
        </ol>
    </nav>
{% endblock %}

{% block content %}
    <div class="auth-card">
        <h1>🏢 {{ title }}</h1>
        {% if form.instance.image %}
            <p><img src="{{ form.instance.image.url }}" alt="{{ form.instance.name }}" style="width:100%;max-height:180px;object-fit:cover;border-radius:8px;"></p>
        {% endif %}
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Save</button>
        </form>
    </div>
{% endblock %}
